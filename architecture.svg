<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="800" height="260" fill="#0f1620"/>
  <text x="400" y="32" text-anchor="middle" fill="#e8edf2" font-size="18" font-weight="600">Nessus Vulnerability Scanner — Install &amp; Scan Flow</text>

  <g font-size="13" fill="#0f1620">
    <rect x="20" y="90" width="140" height="70" rx="10" fill="#4cc9f0"/>
    <text x="90" y="120" text-anchor="middle" font-weight="600">Ubuntu/Debian</text>
    <text x="90" y="138" text-anchor="middle">Host</text>

    <rect x="200" y="90" width="150" height="70" rx="10" fill="#4895ef"/>
    <text x="275" y="115" text-anchor="middle" font-weight="600" fill="#fff">Install Nessus</text>
    <text x="275" y="133" text-anchor="middle" fill="#fff">.deb + systemd</text>

    <rect x="390" y="90" width="150" height="70" rx="10" fill="#4361ee"/>
    <text x="465" y="115" text-anchor="middle" font-weight="600" fill="#fff">nessusd</text>
    <text x="465" y="133" text-anchor="middle" fill="#fff">:8834 (TLS)</text>

    <rect x="580" y="90" width="200" height="70" rx="10" fill="#3a0ca3"/>
    <text x="680" y="115" text-anchor="middle" font-weight="600" fill="#fff">Web UI</text>
    <text x="680" y="133" text-anchor="middle" fill="#fff">Activate · Scan · Report</text>
  </g>

  <line x1="160" y1="125" x2="198" y2="125" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="125" x2="388" y2="125" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="125" x2="578" y2="125" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="400" y="210" text-anchor="middle" fill="#8a99a8" font-size="12">apt update → dpkg -i Nessus.deb → systemctl enable/start nessusd → first scan</text>
</svg>
